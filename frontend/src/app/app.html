<header class="cabecera">
  <div class="cabecera-interior">
    <a routerLink="/facturas" class="marca" aria-label="Monolegal, inicio">
      <img src="marca/pin-monolegal.png" alt="" width="30" height="30">
      <span class="marca-nombre">Monolegal</span>
      <span class="marca-modulo">Cartera</span>
    </a>

    <nav class="menu" aria-label="Secciones">
      <a routerLink="/facturas" routerLinkActive="activo">Facturas</a>
      <a routerLink="/programacion" routerLinkActive="activo">Programación</a>
      <a routerLink="/historial" routerLinkActive="activo">Historial</a>
      <a [href]="mailpit" target="_blank" rel="noopener">Buzón de correos ↗</a>
    </nav>

    <span
      class="salud"
      [class.ok]="serviciosOk() === true"
      [class.mal]="serviciosOk() === false"
      [title]="detalleSalud()"
    >
      <span class="punto" aria-hidden="true"></span>
      {{ serviciosOk() === null ? 'Comprobando…' : serviciosOk() ? 'Servicios en línea' : 'Revisar servicios' }}
    </span>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="pie">
  Prueba técnica · no es un producto oficial de Monolegal.
</footer>
