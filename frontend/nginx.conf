server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las llamadas /api se reenvían al backend (mismo origen: sin problemas de CORS).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Rutas de Angular: cualquier URL desconocida carga index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
